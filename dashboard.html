<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中生物 數位學習單 即時繳交儀表板</title>
  <link rel="stylesheet" href="assets/css/hub.css?v=4.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    /* ========================================================
       儀表板專屬主題配色變數 (支援翡翠綠、星空紫、科技藍、琥珀金動態切換)
       ======================================================== */
    [data-theme="ocean"] {
      --dash-primary: #0284c7;
      --dash-accent: #0369a1;
      --dash-light: #f0f9ff;
      --dash-border: #7dd3fc;
      --dash-card-bg: #ffffff;
      --dash-header-bg: linear-gradient(135deg, #070d19 0%, #0f1c32 50%, #0284c7 100%);
      --dash-progress-fill: linear-gradient(90deg, #38bdf8, #0284c7);
      --dash-text-dark: #0f172a;
    }

    [data-theme="emerald"] {
      --dash-primary: #059669;
      --dash-accent: #047857;
      --dash-light: #ecfdf5;
      --dash-border: #6ee7b7;
      --dash-card-bg: #ffffff;
      --dash-header-bg: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
      --dash-progress-fill: linear-gradient(90deg, #10b981, #059669);
      --dash-text-dark: #064e3b;
    }

    :root, [data-theme="purple"] {
      --dash-primary: #7c3aed;
      --dash-accent: #6d28d9;
      --dash-light: #faf5ff;
      --dash-border: #c4b5fd;
      --dash-card-bg: #ffffff;
      --dash-header-bg: linear-gradient(135deg, #2e1065 0%, #4c1d95 50%, #7c3aed 100%);
      --dash-progress-fill: linear-gradient(90deg, #a855f7, #7c3aed);
      --dash-text-dark: #3b0764;
    }

    [data-theme="amber"] {
      --dash-primary: #d97706;
      --dash-accent: #b45309;
      --dash-light: #fffbeb;
      --dash-border: #fcd34d;
      --dash-card-bg: #ffffff;
      --dash-header-bg: linear-gradient(135deg, #78350f 0%, #92400e 100%);
      --dash-progress-fill: linear-gradient(90deg, #f59e0b, #d97706);
      --dash-text-dark: #78350f;
    }

    body.dark-mode {
      background-color: #0b1120 !important;
      color: #f8fafc !important;
    }

    body.dark-mode .dashboard-card,
    body.dark-mode .seat-matrix-card,
    body.dark-mode .leaderboard-card,
    body.dark-mode .stats-panel,
    body.dark-mode .modal-content {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }

    body.dark-mode .seat-card.missing {
      background-color: rgba(245, 158, 11, 0.08) !important;
      border-color: #475569 !important;
    }

    body.dark-mode .seat-card.absent {
      background-color: #334155 !important;
      color: #94a3b8 !important;
    }

    body.dark-mode .seat-card.submitted {
      background-color: rgba(16, 185, 129, 0.15) !important;
      border-color: #10b981 !important;
    }

    body.dark-mode input,
    body.dark-mode select {
      background-color: #334155 !important;
      color: #ffffff !important;
      border-color: #475569 !important;
    }

    /* 頂部儀表板標題卡片 */
    .dashboard-header-card {
      background: var(--dash-header-bg);
      color: #ffffff;
      border-radius: 18px;
      padding: 1.6rem 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .dashboard-title-group h1 {
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
      letter-spacing: 0.5px;
    }

    .dashboard-title-group p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .dashboard-toolbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .tool-select {
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
    }

    .btn-tool {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .btn-refresh {
      background: #10b981;
      border-color: #34d399;
    }

    .btn-refresh:hover {
      background: #059669;
    }

    /* 繳交參與率統計面板 */
    .stats-panel {
      background: #ffffff;
      border: 1.5px solid var(--dash-border);
      border-radius: 14px;
      padding: 1.2rem 1.6rem;
      margin-bottom: 1.6rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .stats-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--dash-text-dark);
    }

    .stats-counter {
      font-size: 1.05rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--dash-progress-fill);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .action-subbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed #cbd5e1;
    }

    .absent-input-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1 1 300px;
    }

    .tool-btn-group {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn-action-primary {
      background: var(--dash-primary);
      color: #ffffff;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action-teal {
      background: #0d9488;
      color: #ffffff;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-action-amber {
      background: #d97706;
      color: #ffffff;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    /* 主網格：左側 Top 5，右側 35 人卡片矩陣 */
    .dashboard-main-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .dashboard-main-grid {
        grid-template-columns: 1fr;
      }
    }

    .leaderboard-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 1.2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .leaderboard-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--dash-primary);
      padding-bottom: 0.5rem;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 0.92rem;
    }

    .leaderboard-rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .leaderboard-rank.rank-1 { background: #fef08a; color: #854d0e; }
    .leaderboard-rank.rank-2 { background: #e2e8f0; color: #475569; }
    .leaderboard-rank.rank-3 { background: #fed7aa; color: #9a3412; }

    /* 全班座號 35 人矩陣 */
    .seat-matrix-card {
      background: #ffffff;
      border: 1.5px solid var(--dash-border);
      border-radius: 14px;
      padding: 1.4rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .matrix-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 0.8rem;
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 10px;
    }

    .seat-card {
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .seat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .seat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 2px;
    }

    .seat-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seat-status-text {
      font-size: 0.72rem;
      margin-top: 4px;
      font-weight: 600;
    }

    /* 繳交狀態 */
    .seat-card.submitted {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .seat-card.submitted .seat-num { color: #166534; }
    .seat-card.submitted .seat-name { color: #15803d; }

    .seat-score-badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 800;
      color: #15803d;
      background: #dcfce7;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .seat-card.missing {
      background: #faf5ff;
      border-color: #ddd6fe;
    }
    .seat-card.missing .seat-num { color: #8b5cf6; }
    .seat-card.missing .seat-name { color: #6d28d9; }
    .seat-card.missing .seat-status-text { color: #7c3aed; }
    .seat-card.missing:hover {
      border-color: #a855f7;
      background: #f3e8ff;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
    }

    .seat-card.absent {
      background: #f1f5f9;
      border-color: #cbd5e1;
      opacity: 0.65;
    }
    .seat-card.absent .seat-name { color: #94a3b8; }
    .seat-card.absent .seat-status-text { color: #64748b; }
    /* ⚠️ 同號衝突警示狀態 (兩位以上不同姓名誤劃同號) */
    .seat-card.conflict {
      background: #fef3c7 !important;
      border: 2px solid #f59e0b !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.35) !important;
      animation: conflictPulse 1.8s infinite ease-in-out;
    }
    @keyframes conflictPulse {
      0%, 100% { border-color: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.3); }
      50% { border-color: #d97706; box-shadow: 0 0 14px rgba(217, 119, 6, 0.6); }
    }
    .seat-card.conflict .seat-num { color: #b45309 !important; font-weight: 900; }
    .seat-card.conflict .seat-name { color: #b45309 !important; font-weight: 800; }
    .seat-conflict-badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 800;
      color: #92400e;
      background: #fde68a;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid #fcd34d;
    }


    /* 隱藏分數切換 */
    .seat-grid.hide-score .seat-score-badge {
      display: none !important;
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 28, 50, 0.85);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 28px;
      width: 100%;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 2px solid var(--dash-border);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 1.4rem;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #64748b;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 1.2rem;
    }
  </style>

<style id="pinGatekeeperStyle">
/* 🔒 教師安全防護 PIN 密碼鎖樣式 */
.pin-modal-overlay {
  position: fixed !important;
  top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
  background: rgba(15, 23, 42, 0.96) !important;
  backdrop-filter: blur(16px) !important;
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  z-index: 9999999 !important;
}
.pin-modal-overlay.hidden {
  display: none !important;
}
.pin-modal-card {
  background: #1e293b !important;
  border: 2px solid #c084fc !important;
  border-radius: 24px !important;
  padding: 36px 28px !important;
  text-align: center !important;
  max-width: 420px !important;
  width: 90% !important;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7) !important;
  animation: pinPopIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif !important;
}
@keyframes pinPopIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
.pin-icon {
  font-size: 3.2rem !important;
  margin-bottom: 12px !important;
  line-height: 1 !important;
}
.pin-modal-card h2 {
  font-size: 1.45rem !important;
  color: #f8fafc !important;
  margin: 0 0 10px 0 !important;
  font-weight: 800 !important;
}
.pin-modal-card p {
  color: #94a3b8 !important;
  font-size: 0.92rem !important;
  margin-bottom: 20px !important;
  line-height: 1.5 !important;
}
.pin-modal-card input {
  width: 82% !important;
  padding: 12px !important;
  font-size: 1.6rem !important;
  text-align: center !important;
  letter-spacing: 6px !important;
  background: #0f172a !important;
  border: 2px solid #334155 !important;
  border-radius: 12px !important;
  color: #c084fc !important;
  margin-bottom: 12px !important;
  outline: none !important;
  box-sizing: border-box !important;
}
.pin-modal-card input:focus {
  border-color: #c084fc !important;
  box-shadow: 0 0 12px rgba(168, 85, 247, 0.4) !important;
}
.pin-error-text {
  color: #f87171 !important;
  font-size: 0.88rem !important;
  font-weight: 700 !important;
  min-height: 22px !important;
  margin-bottom: 14px !important;
}
.btn-pin-submit {
  width: 100% !important;
  padding: 13px !important;
  background: linear-gradient(135deg, #7c3aed, #5b21b6) !important;
  color: white !important;
  border: none !important;
  border-radius: 12px !important;
  font-weight: 800 !important;
  font-size: 1.05rem !important;
  cursor: pointer !important;
  transition: opacity 0.2s, transform 0.1s !important;
  box-sizing: border-box !important;
}
.btn-pin-submit:hover {
  opacity: 0.95 !important;
  transform: translateY(-1px) !important;
}
</style>

</head>
<body data-theme="purple">

  <!-- 頂部導覽列 -->
  <header class="navbar">
    <a href="index.html" class="navbar-brand">
      <span>🧬 國中生物數位學習單平台</span>
      <span class="navbar-badge">教師專用即時儀表板</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn-nav" style="background: rgba(255,255,255,0.15); color: #fff;">🏠 回派卷總覽大廳</a>
    </div>
  </header>

  <div class="container" style="max-width: 1140px;">
    
    <!-- 頂部儀表板標題與控制工具列 -->
    <div class="dashboard-header-card">
      <div class="dashboard-title-group">
        <h1>🏆 生物數位學習單 即時繳交儀表板</h1>
        <p>即時串接 Google 雲端試算表 ｜ 雙向同步出缺席、就地更新防洗板與一鍵通報</p>
      </div>

      <div class="dashboard-toolbar">
        <!-- 班級選擇 (701~710) -->
        <select id="selectClass" class="tool-select" onchange="handleClassOrUnitChange()">
          <option value="701">701 班</option>
          <option value="702">702 班</option>
          <option value="703">703 班</option>
          <option value="704">704 班</option>
          <option value="705">705 班</option>
          <option value="706">706 班</option>
          <option value="707">707 班</option>
          <option value="708">708 班</option>
          <option value="709">709 班</option>
          <option value="710">710 班</option>
        </select>

        <!-- 單元選擇 (可共用切換任意生物學習單) -->
        <select id="selectUnit" class="tool-select" onchange="handleClassOrUnitChange()">
          <option value="3-2" selected>【3-2】人體的循環</option>
          <option value="4-2">【4-2】內分泌系統</option>
          <option value="4-1">【4-1】神經系統</option>
          <option value="4-3">【4-3】恆定性與體溫</option>
          <option value="5-1">【5-1】生物的生殖</option>
        </select>

        <!-- 應到人數 -->
        <div style="display: flex; align-items: center; gap: 0.3rem; background: rgba(255,255,255,0.18); padding: 0.4rem 0.7rem; border-radius: 8px;">
          <span style="font-size: 0.88rem; font-weight: 700;">應到:</span>
          <input type="number" id="inputExpectedCount" value="30" min="1" max="35" style="width: 50px; font-weight: 800; padding: 0.2rem; border-radius: 4px; border: none; text-align: center;" onchange="updateDashboardStats()">
          <span style="font-size: 0.88rem;">人</span>
        </div>

        <!-- 4 色主題切換 (行動方程式同款：藍/綠/紫/琥珀) -->
        <select id="selectTheme" class="tool-select" style="font-size: 0.88rem;" onchange="changeDashboardTheme(this.value)">
          <option value="purple" selected>🔮 典雅薰衣草紫 (全平台統一)</option>
          <option value="ocean">🌊 極光科技藍</option>
          <option value="emerald">🌿 翡翠森林綠</option>
          <option value="amber">🍯 經典琥珀金</option>
        </select>

        <!-- 分數隱私遮蔽 -->
        <button type="button" class="btn-tool" onclick="toggleScoreVisibility()">
          👁️ <span id="scoreToggleText">隱藏分數</span>
        </button>

        <!-- 深色模式 -->
        <button type="button" class="btn-tool" onclick="toggleDarkMode()">
          🌙 夜間
        </button>

        <!-- 刷新資料 -->
        <!-- 即時自動同步開關 (5秒倒數) -->
        <button type="button" id="btnAutoRefresh" class="btn-tool" onclick="toggleAutoRefresh()" style="background: rgba(16, 185, 129, 0.25); border-color: #34d399; font-weight: 800;" title="每 5 秒自動同步最新繳交紀錄">
          🟢 即時同步 <span id="autoRefreshCountdown" style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 4px; margin-left: 3px;">5s</span>
        </button>

        <!-- 手動刷新資料 -->
        <button type="button" id="btnManualRefresh" class="btn-tool btn-refresh" onclick="fetchLiveDataFromGAS(false)">
          🔄 立即刷新

      <h3 id="modalDetailTitle" style="font-size: 1.3rem; color: var(--dash-primary); font-weight: 800; margin-bottom: 0.8rem;">作答詳情</h3>

  <!-- 引入共用設定與工具函式 (附帶版本號強制作廢舊快取) -->
  <script src="assets/js/common.js?v=2.1"></script>
  <script>
    // ⏱️ 5 秒自動同步計時器全域常數與狀態
    const AUTO_REFRESH_INTERVAL_SECONDS = 5;
    let autoRefreshCountdown = AUTO_REFRESH_INTERVAL_SECONDS;
    let isAutoRefreshActive = true;
    let autoRefreshTimer = null;

    let currentLiveRecords = [];
    let currentSeatDataMap = new Map();
    let absentSeatsSet = new Set();
    let isScoreHidden = false;

    // 1. 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('bio_dash_theme') || 'purple';
      document.getElementById('selectTheme').value = savedTheme;
      changeDashboardTheme(savedTheme);

      // 生成 01 ~ 35 號座號卡
      renderEmptySeatCards();

      // 從 GAS 抓取第一筆最新資料
      fetchLiveDataFromGAS();

      // 啟動 5 秒即時同步引擎
      initAutoRefresh();
    });

    // 2. 配色切換
    function changeDashboardTheme(themeName) {
      document.body.setAttribute('data-theme', themeName);
      localStorage.setItem('bio_dash_theme', themeName);
    }

    // 3. 深色夜間模式
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    // 4. 導師分數切換
    function toggleScoreVisibility() {
      isScoreHidden = !isScoreHidden;
      const seatMatrix = document.getElementById('seatGrid');
      if (isScoreHidden) {
        seatMatrix.classList.add('hide-score');
        document.getElementById('scoreToggleText').textContent = '顯示分數';
      } else {
        seatMatrix.classList.remove('hide-score');
        document.getElementById('scoreToggleText').textContent = '隱藏分數';
      }
    }

    // 5. 渲染 01 ~ 35 號基礎座號卡
    function renderEmptySeatCards() {
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= COURSE_CONFIG.maxSeatNumber; i++) {
        const seatStr = i < 10 ? '0' + i : '' + i;
        const card = document.createElement('div');
        card.id = 'seat_card_' + seatStr;
        card.className = 'seat-card missing';
        card.onclick = () => handleSeatCardClick(seatStr);
        card.innerHTML = `
          <div class="seat-num">${seatStr} 號</div>
          <div class="seat-name" id="name_${seatStr}">-</div>
          <div class="seat-status-text" id="status_${seatStr}">作答中 💪</div>
        `;
        grid.appendChild(card);
      }
    }

    // 6. 切換班級或單元
    function handleClassOrUnitChange() {
      const classVal = document.getElementById('selectClass').value;
      document.getElementById('displayClassTitle').textContent = classVal;
      autoRefreshCountdown = AUTO_REFRESH_INTERVAL_SECONDS;
      updateAutoRefreshUi();
      fetchLiveDataFromGAS(false);
    }

    // ⏱️ 6.1 即時自動同步控制引擎 (5 秒倒數)
    function initAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (!isAutoRefreshActive) return;

        // 若老師正在開啟彈窗操作 (如裁決衝突、補登或密碼解鎖)，暫停自動刷新避免干擾
        const studentModal = document.getElementById('studentDetailModal');
        const manualModal = document.getElementById('manualGradeModal');
        const pinModal = document.getElementById('pinLockModal');
        const isModalOpen = (studentModal && studentModal.classList.contains('active')) ||
                            (manualModal && manualModal.classList.contains('active')) ||
                            (pinModal && !pinModal.classList.contains('hidden'));

        if (isModalOpen) {
          return;
        }

        autoRefreshCountdown--;
        if (autoRefreshCountdown <= 0) {
          autoRefreshCountdown = AUTO_REFRESH_INTERVAL_SECONDS;
          fetchLiveDataFromGAS(true);
        }
        updateAutoRefreshUi();
      }, 1000);
    }

    function toggleAutoRefresh() {
      isAutoRefreshActive = !isAutoRefreshActive;
      if (isAutoRefreshActive) {
        autoRefreshCountdown = AUTO_REFRESH_INTERVAL_SECONDS;
        fetchLiveDataFromGAS(false);
      }
      updateAutoRefreshUi();
    }

    function updateAutoRefreshUi() {
      const btn = document.getElementById('btnAutoRefresh');
      const badge = document.getElementById('autoRefreshCountdown');
      if (!btn || !badge) return;

      if (isAutoRefreshActive) {
        btn.style.background = 'rgba(16, 185, 129, 0.25)';
        btn.style.borderColor = '#34d399';
        badge.textContent = `${autoRefreshCountdown}s`;
        badge.style.display = 'inline-block';
        btn.title = `即時同步中：每 ${AUTO_REFRESH_INTERVAL_SECONDS} 秒自動抓取最新名單（點擊可暫停）`;
      } else {
        btn.style.background = 'rgba(239, 68, 68, 0.25)';
        btn.style.borderColor = '#f87171';
        badge.textContent = '已暫停';
        badge.style.display = 'inline-block';
        btn.title = '已暫停自動同步（點擊可重啟）';
      }
    }

    // 7. 從 Google Apps Script 雙向抓取即時資料 (支援背景無感靜默刷新)
    async function fetchLiveDataFromGAS(isSilent = false) {
      const classVal = document.getElementById('selectClass').value;
      const unitVal = document.getElementById('selectUnit').value;
      
      const refreshBtn = document.getElementById('btnManualRefresh') || document.querySelector('.btn-refresh');
      if (refreshBtn && !isSilent) refreshBtn.textContent = '⏳ 讀取中...';

      if (!COURSE_CONFIG.gasEndpoint || COURSE_CONFIG.gasEndpoint === 'YOUR_GAS_EXEC_URL') {
        renderMockDataForPreview();
        if (refreshBtn && !isSilent) refreshBtn.textContent = '🔄 立即刷新';
        return;
      }

      try {
        const fetchUrl = `${COURSE_CONFIG.gasEndpoint}?action=getRecords&sheetId=${unitVal}&studentClass=${classVal}`;
        const res = await fetch(fetchUrl);
        const data = await res.json();

        if (data.status === 'success') {
          // 🛡️ 智能處理：身分分組、去重、衝突比對
          const processed = processClassRecords(data.records || [], classVal);
          currentSeatDataMap = processed.seatDataMap;
          currentLiveRecords = processed.cleanList;
          
          if (data.attendance) {
            if (data.attendance.expectedCount) {
              document.getElementById('inputExpectedCount').value = data.attendance.expectedCount;
            }
            if (Array.isArray(data.attendance.absentSeats)) {
              absentSeatsSet = new Set(data.attendance.absentSeats);
              document.getElementById('inputAbsentSeats').value = Array.from(absentSeatsSet).join(', ');
            }
          }

          renderLiveDataToMatrix();
        }
      } catch (err) {
        console.warn('GAS 讀取異常:', err);
        if (!isSilent) {
          alert('⚠️ 讀取試算表資料失敗！\n\n請檢查網路連線或 Apps Script 部署權限是否設為「所有人 (Anyone)」。');
        }
      }

      if (refreshBtn && !isSilent) refreshBtn.textContent = '🔄 立即刷新';
    }

    // 預覽展示假資料（當尚未換上真實 GAS URL 時）
    function renderMockDataForPreview() {
      const mockRaw = [
        { studentSeat: "01", studentName: "陳立", score: 100, studentGroup: "第 1 組", timestamp: "剛剛", answers: { q1: "生長激素" } },
        { studentSeat: "05", studentName: "林小真", score: 95, studentGroup: "個人速記", timestamp: "1分鐘前", answers: { q1: "甲狀腺素" } },
        { studentSeat: "10", studentName: "陳品謙", score: 75, studentGroup: "第 2 組", timestamp: "4分鐘前", answers: {} },
        { studentSeat: "10", studentName: "陳品謙", score: 85, studentGroup: "第 3 組", timestamp: "剛剛", answers: {} },
        { studentSeat: "12", studentName: "張智凱", score: 90, studentGroup: "第 3 組", timestamp: "3分鐘前", answers: {} }
      ];
      absentSeatsSet = new Set(["03"]);
      document.getElementById('inputAbsentSeats').value = "03";
      
      const processed = processClassRecords(mockRaw, document.getElementById('selectClass').value);
      currentSeatDataMap = processed.seatDataMap;
      currentLiveRecords = processed.cleanList;
      renderLiveDataToMatrix();
    }

    // 🛡️ 8. 座號衝突比對與學生身分智能分組引擎 (支援老師憑真實姓名判別同號誤劃)
    function processClassRecords(records, targetClass) {
      if (!Array.isArray(records)) return { seatDataMap: new Map(), cleanList: [] };

      // 步驟 1：過濾屬於該班級、座號介於 01~maxSeatNumber 的紀錄
      const classRecords = records.filter(r => {
        if (!r || typeof r !== 'object') return false;
        const cls = String(r.studentClass || '').trim();
        if (targetClass && cls !== String(targetClass).trim()) return false;
        const s = parseInt(r.studentSeat, 10);
        return !isNaN(s) && s >= 1 && s <= COURSE_CONFIG.maxSeatNumber;
      });

      // 步驟 2：解析時間戳記與內嵌座號
      const enriched = classRecords.map((r, idx) => {
        let seat = String(r.studentSeat).padStart(2, '0');
        try {
          const parsed = typeof r.answers === 'string' ? JSON.parse(r.answers) : r.answers;
          if (parsed && parsed.studentSeat) {
            const innerSeat = parseInt(parsed.studentSeat, 10);
            if (!isNaN(innerSeat) && innerSeat >= 1 && innerSeat <= COURSE_CONFIG.maxSeatNumber) {
              seat = String(innerSeat).padStart(2, '0');
            }
          }
        } catch (e) {}

        let timeMs = 0;
        if (r.timestamp) {
          timeMs = Date.parse(r.timestamp) || 0;
          if (timeMs === 0) {
            const cleaned = String(r.timestamp).replace('上午', 'AM ').replace('下午', 'PM ');
            timeMs = Date.parse(cleaned) || 0;
          }
        }

        return {
          ...r,
          studentSeat: seat,
          studentName: String(r.studentName || '').trim(),
          _timeMs: timeMs || idx
        };
      });

      // 步驟 3：依時間戳記排序 (由舊到新)
      enriched.sort((a, b) => a._timeMs - b._timeMs);

      // 步驟 4：追蹤每位學生最新選擇的座號 (若同名學生後續改選座號，自動追蹤最新座號)
      const studentLatestSeat = new Map();
      enriched.forEach(r => {
        if (r.studentName) {
          studentLatestSeat.set(r.studentName, r.studentSeat);
        }
      });

      // 步驟 5：初始化座號分組映射 (1 ~ maxSeatNumber)
      const seatDataMap = new Map();
      for (let i = 1; i <= COURSE_CONFIG.maxSeatNumber; i++) {
        const s = String(i).padStart(2, '0');
        seatDataMap.set(s, {
          activeRecords: [],
          historicalRecords: [],
          isConflict: false,
          uniqueNames: []
        });
      }

      // 步驟 6：將紀錄歸戶至各座號
      enriched.forEach(r => {
        const seat = r.studentSeat;
        if (!seatDataMap.has(seat)) return;
        const group = seatDataMap.get(seat);

        const currentLatest = studentLatestSeat.get(r.studentName);
        if (r.studentName && currentLatest && currentLatest !== seat) {
          // 該生先前曾誤劃此座號，後續已改選至 currentLatest
          group.historicalRecords.push(r);
        } else {
          group.activeRecords.push(r);
        }
      });

      // 步驟 7：分析每個座號的衝突與建置最新榜單
      const cleanList = [];
      seatDataMap.forEach((group, seatStr) => {
        // 時間降冪排序 (最新提交在最前)
        group.activeRecords.sort((a, b) => b._timeMs - a._timeMs);
        group.historicalRecords.sort((a, b) => b._timeMs - a._timeMs);

        // 收集此座號下所有不重複的活躍學生姓名
        const namesSet = new Set(group.activeRecords.map(r => r.studentName).filter(Boolean));
        group.uniqueNames = Array.from(namesSet);

        // 若有 2 位以上「不同姓名」的學生同時占用此座號，判定為【同號衝突】！
        if (group.uniqueNames.length > 1) {
          group.isConflict = true;
        }

        if (group.activeRecords.length > 0) {
          cleanList.push(group.activeRecords[0]);
        }
      });

      return { seatDataMap, cleanList };
    }

    // 9. 將讀取的資料繪製上 35 人卡片矩陣 (支援同號衝突警示與姓名核對)
    function renderLiveDataToMatrix() {
      renderEmptySeatCards();

      for (let i = 1; i <= COURSE_CONFIG.maxSeatNumber; i++) {
        const seatStr = i < 10 ? '0' + i : '' + i;
        const card = document.getElementById('seat_card_' + seatStr);
        if (!card) continue;

        const group = currentSeatDataMap.get(seatStr) || { activeRecords: [], historicalRecords: [], isConflict: false, uniqueNames: [] };

        if (absentSeatsSet.has(seatStr)) {
          // 狀態 1：請假狀態
          card.className = 'seat-card absent';
          card.querySelector('.seat-name').textContent = '請假';
          card.querySelector('.seat-status-text').textContent = '🏖️ 今日請假';
        } else if (group.isConflict) {
          // 狀態 2：⚠️ 同號衝突！(有 2 位以上不同學生誤劃此座號)
          card.className = 'seat-card conflict';
          card.querySelector('.seat-name').innerHTML = `⚠️ ${group.uniqueNames.join(' / ')}`;
          card.querySelector('.seat-status-text').innerHTML = `
            <span class="seat-conflict-badge">⚠️ 衝突 (${group.activeRecords.length}人)</span>
            <div style="font-size: 0.72rem; color: #b45309; margin-top: 2px; font-weight: 700;">點擊核對身分 🔍</div>
          `;
          card.onclick = () => showConflictDetailModal(seatStr, group);
        } else if (group.activeRecords.length > 0) {
          // 狀態 3：正常已繳交狀態 (包含同一人多次提交)
          const rec = group.activeRecords[0]; // 取該生最新一次作答
          const subCount = group.activeRecords.length;
          card.className = 'seat-card submitted';
          card.querySelector('.seat-name').textContent = rec.studentName || '已交';
          card.querySelector('.seat-status-text').innerHTML = `
            <span class="seat-score-badge">${rec.score || 100} 分</span>
            <div style="font-size: 0.72rem; color: #059669; margin-top: 2px;">
              ${subCount > 1 ? `已交 (${subCount}次) ✅` : '已完成 ✅'}
            </div>
          `;
          card.onclick = () => showStudentDetailModal(rec, group);
        } else {
          // 狀態 4：未繳交
          card.className = 'seat-card missing';
          card.querySelector('.seat-name').textContent = '未交';
          card.querySelector('.seat-status-text').textContent = '作答中 💪';
        }
      }

      updateDashboardStats();
      renderLeaderboard();
    }

    // 10. 更新頂部參與率進度條
    function updateDashboardStats() {
      const expectedTotal = parseInt(document.getElementById('inputExpectedCount').value) || 30;
      const absentCount = absentSeatsSet.size;
      const actualExpected = Math.max(1, expectedTotal - absentCount);
      document.getElementById('actualExpectedCount').textContent = actualExpected;

      const submittedCount = currentLiveRecords.filter(r => !absentSeatsSet.has(String(r.studentSeat).padStart(2, '0'))).length;
      document.getElementById('submittedCount').textContent = submittedCount;

      const rate = Math.min(100, Math.round((submittedCount / actualExpected) * 100));
      if (rate >= 100 && submittedCount >= actualExpected && actualExpected > 0) {
        document.getElementById('ratePercent').innerHTML = `100% <span style="font-size: 0.82rem; background: #10B981; color: white; padding: 2px 8px; border-radius: 6px; margin-left: 4px; font-weight: 800;">🎉 全班到齊全數繳交！</span>`;
      } else {
        document.getElementById('ratePercent').textContent = rate + '%';
      }
      document.getElementById('progressBarFill').style.width = rate + '%';
    }

    // 11. 點擊座號卡切換請假
    function handleSeatCardClick(seatStr) {
      if (absentSeatsSet.has(seatStr)) {
        absentSeatsSet.delete(seatStr);
      } else {
        absentSeatsSet.add(seatStr);
      }
      document.getElementById('inputAbsentSeats').value = Array.from(absentSeatsSet).join(', ');
      renderLiveDataToMatrix();
    }

    // 12. 手動輸入請假座號
    function handleAbsentInputChange() {
      const raw = document.getElementById('inputAbsentSeats').value;
      const parts = raw.split(/[,\s]+/).map(s => s.trim().padStart(2, '0')).filter(s => s && s !== '00');
      absentSeatsSet = new Set(parts);
      renderLiveDataToMatrix();
    }

    // 13. 儲存出缺席至 Google 試算表
    async function syncAttendanceToGoogleSheet() {
      const classVal = document.getElementById('selectClass').value;
      const unitVal = document.getElementById('selectUnit').value;
      const expectedTotal = parseInt(document.getElementById('inputExpectedCount').value) || 30;

      const missingSeats = [];
      const submittedSeats = new Set(currentLiveRecords.map(r => String(r.studentSeat).padStart(2, '0')));
      for (let i = 1; i <= expectedTotal; i++) {
        const s = i < 10 ? '0' + i : '' + i;
        if (!absentSeatsSet.has(s) && !submittedSeats.has(s)) {
          missingSeats.push(s);
        }
      }

      const payload = {
        action: 'saveAttendance',
        sheetId: unitVal,
        studentClass: classVal,
        expectedCount: expectedTotal,
        absentSeats: Array.from(absentSeatsSet),
        unsubmittedSeats: missingSeats
      };

      const btn = event.target;
      const orig = btn.innerHTML;
      btn.innerHTML = '⏳ 正在同步試算表...';
      btn.disabled = true;

      try {
        await fetch(COURSE_CONFIG.gasEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          mode: 'no-cors'
        });
        alert(`🎉 ${classVal} 班【單元 ${unitVal}】出缺席紀錄已成功儲存至試算表【出缺席紀錄】分頁！`);
      } catch (e) {
        alert('出缺席同步完成！');
      }

      btn.innerHTML = orig;
      btn.disabled = false;
    }

    // 14. 一鍵複製未交名單 (含同號衝突備註)
    function copyMissingListToClipboard() {
      const classVal = document.getElementById('selectClass').value;
      const unitVal = document.getElementById('selectUnit').value;
      const expectedTotal = parseInt(document.getElementById('inputExpectedCount').value) || 30;
      const actualExpected = Math.max(1, expectedTotal - absentSeatsSet.size);

      const submittedSeats = new Set(currentLiveRecords.map(r => String(r.studentSeat).padStart(2, '0')));
      const missingSeats = [];
      for (let i = 1; i <= expectedTotal; i++) {
        const s = i < 10 ? '0' + i : '' + i;
        if (!absentSeatsSet.has(s) && !submittedSeats.has(s)) {
          missingSeats.push(s + '號');
        }
      }

      // 檢查是否有尚未裁決的同號衝突
      const conflictList = [];
      currentSeatDataMap.forEach((group, seatStr) => {
        if (group.isConflict) {
          conflictList.push(`${seatStr} 號 (${group.uniqueNames.join(' / ')})`);
        }
      });

      const absentList = Array.from(absentSeatsSet).map(s => s + '號').join(', ') || '無';
      const missingListStr = missingSeats.length > 0 ? missingSeats.join(', ') : '全數繳交完畢 🎉';

      let copyText = `📢 ${classVal} 班【國中生物】單元 ${unitVal} 學習單繳交通報
• 實到應交：${actualExpected} 人 / 已交：${submittedSeats.size} 人
• 今日請假：${absentList}
• 尚未繳交座號：${missingListStr}`;

      if (conflictList.length > 0) {
        copyText += `\n• ⚠️ 誤劃同號待確認：${conflictList.join('、')}`;
      }

      copyToClipboard(copyText, event.target);
    }

    // 15. 繪製英雄榜 Top 5
    function renderLeaderboard() {
      const container = document.getElementById('leaderboardList');
      if (currentLiveRecords.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 1.5rem 0;">尚無繳交紀錄<br>請等待學生送出學習單</p>';
        return;
      }

      const sorted = [...currentLiveRecords].sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0)).slice(0, 5);

      container.innerHTML = sorted.map((item, idx) => `
        <div class="leaderboard-item">
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <div class="leaderboard-rank rank-${idx + 1}">${idx + 1}</div>
            <div>
              <strong>${item.studentSeat} 號 ${item.studentName || '同學'}</strong>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${item.studentGroup || ''}</div>
            </div>
          </div>
          <div style="font-weight: 800; color: #10b981;">${item.score || 100} 分</div>
        </div>
      `).join('');
    }

    // 16. 手動補登成績
    function openManualGradeModal() {
      document.getElementById('manualGradeModal').classList.add('active');
    }
    function closeManualGradeModal() {
      document.getElementById('manualGradeModal').classList.remove('active');
    }
    async function submitManualGrade() {
      const classVal = document.getElementById('selectClass').value;
      const unitVal = document.getElementById('selectUnit').value;
      const seat = document.getElementById('manualSeat').value.trim().padStart(2, '0');
      const name = document.getElementById('manualName').value.trim();
      const score = parseInt(document.getElementById('manualScore').value) || 95;

      if (!seat || !name) {
        alert('請填寫座號與姓名！');
        return;
      }

      const payload = {
        sheetId: unitVal,
        studentClass: classVal,
        studentSeat: seat,
        studentName: name,
        studentGroup: '教師手動補登',
        score: score,
        scoreBreakdown: ['教師手動補登成績 (+' + score + '分)'],
        answers: { manual: true }
      };

      try {
        await fetch(COURSE_CONFIG.gasEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          mode: 'no-cors'
        });
        alert(`✅ 已為 ${classVal} 班 ${seat} 號 ${name} 補登成績，並同步覆蓋試算表！`);
        closeManualGradeModal();
        fetchLiveDataFromGAS(false);
      } catch (e) {
        alert('補登完成！');
      }
    }

    // 17. 檢視學生作答彈窗 (支援多次提交歷史紀錄展示)
    function showStudentDetailModal(rec, group) {
      document.getElementById('modalDetailTitle').textContent = `${rec.studentClass} 班 ${rec.studentSeat} 號 ${rec.studentName} 同學作答詳情`;
      
      let answersHtml = '';
      try {
        const ans = typeof rec.answers === 'string' ? JSON.parse(rec.answers) : rec.answers;
        answersHtml = Object.keys(ans).map(k => `
          <div style="margin-bottom: 0.6rem;">
            <div style="font-weight: 700; color: var(--dash-primary);">題號/欄位 [${k}]：</div>
            <div style="background: #ffffff; padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1;">${Array.isArray(ans[k]) ? ans[k].join(', ') : ans[k]}</div>
          </div>
        `).join('');
      } catch (e) {
        answersHtml = '<div>原始作答：' + (rec.answers || '無') + '</div>';
      }

      // 若該生有多次提交歷史，展示提交時間軸
      let historyHtml = '';
      if (group && group.activeRecords && group.activeRecords.length > 1) {
        historyHtml = `
          <div style="background: #F0FDF4; border: 1px solid #86EFAC; border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem;">
            <div style="font-weight: 800; color: #166534; font-size: 0.88rem; margin-bottom: 0.3rem;">📜 本座號歷次提交紀錄 (共 ${group.activeRecords.length} 次，系統展示最新一次)：</div>
            ${group.activeRecords.map((r, idx) => `
              <div style="font-size: 0.82rem; color: #15803D; padding: 2px 0;">
                • 第 ${group.activeRecords.length - idx} 次：${r.timestamp || '時間未知'} ｜ 得分：<b>${r.score}分</b> (${r.studentGroup || '個人'})
              </div>
            `).join('')}
          </div>
        `;
      }

      document.getElementById('modalDetailBody').innerHTML = `
        ${historyHtml}
        <div style="margin-bottom: 0.8rem; font-weight: 700; color: #10b981;">
          🎯 初評得分：${rec.score} 分 ｜ 繳交時間：${rec.timestamp || '無'}
        </div>
        <div style="margin-bottom: 0.8rem; color: #64748b;">
          組別/模式：${rec.studentGroup} ｜ 明細：${rec.scoreBreakdown || '無'}
        </div>
        <hr style="margin: 0.8rem 0; border: none; border-top: 1px solid #e2e8f0;">
        ${answersHtml}
      `;

      document.getElementById('studentDetailModal').classList.add('active');
    }

    // 18. ⚠️ 同號衝突一鍵裁決彈窗 (方案 B：支援教師免開試算表、一鍵轉移座號即時歸位)
    function showConflictDetailModal(seatStr, group) {
      const classVal = document.getElementById('selectClass').value;
      document.getElementById('modalDetailTitle').innerHTML = `⚠️ <span style="color: #DC2626;">${classVal} 班 ${seatStr} 號 【同號衝突一鍵裁決】</span> (共 ${group.activeRecords.length} 位不同學生)`;

      const studentsHtml = group.activeRecords.map((r, idx) => {
        let ansPreview = '';
        try {
          const ans = typeof r.answers === 'string' ? JSON.parse(r.answers) : r.answers;
          ansPreview = Object.keys(ans).slice(0, 3).map(k => `<b>[${k}]</b> ${Array.isArray(ans[k]) ? ans[k].join(', ') : ans[k]}`).join(' ； ');
        } catch(e) {
          ansPreview = String(r.answers);
        }

        const safeName = (r.studentName || '').replace(/'/g, "\\'");

        return `
          <div style="border: 2px solid ${idx === 0 ? '#F59E0B' : '#CBD5E1'}; border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.9rem; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.05);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <span style="font-size: 1.18rem; font-weight: 800; color: #1E293B;">👤 學生姓名：<span style="color: #0284C7;">${r.studentName || '(未填姓名)'}</span></span>
              <span style="font-weight: 800; color: #10B981; font-size: 1.1rem; background: #ECFDF5; padding: 0.2rem 0.6rem; border-radius: 6px;">${r.score} 分</span>
            </div>
            <div style="font-size: 0.85rem; color: #64748B; margin-bottom: 0.45rem;">
              ⏰ 提交時間：${r.timestamp || '無'} | 🏷️ 組別：${r.studentGroup}
            </div>
            <div style="font-size: 0.85rem; color: #475569; background: #F8FAFC; padding: 0.45rem 0.6rem; border-radius: 6px; border: 1px dashed #CBD5E1; margin-bottom: 0.7rem;">
              💡 作答摘要：${ansPreview || '無作答內容'}
            </div>
            <div style="display: flex; gap: 0.6rem; justify-content: flex-end; border-top: 1px dashed #E2E8F0; padding-top: 0.6rem;">
              <button type="button" class="btn-action-primary" style="padding: 0.4rem 0.9rem; font-size: 0.88rem; font-weight: 700; border-radius: 6px; cursor: pointer;" onclick="confirmSeatOwner('${seatStr}', '${safeName}')">
                👑 確認為 ${seatStr} 號
              </button>
              <button type="button" style="padding: 0.4rem 0.9rem; font-size: 0.88rem; font-weight: 700; border-radius: 6px; cursor: pointer; background: #0284C7; color: white; border: none;" onclick="promptReassignSeat('${seatStr}', '${safeName}')">
                🔄 改移至正確座號
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('modalDetailBody').innerHTML = `
        <div style="background: #FFFBEB; border: 1px solid #FCD34D; border-radius: 8px; padding: 0.75rem 0.9rem; margin-bottom: 1rem; color: #92400E; font-size: 0.9rem; line-height: 1.6;">
          📢 <strong>教師一鍵裁決指引 (免開試算表)</strong>：兩位同學皆填寫了此座號。<br>
          • 點擊 <strong>「👑 確認為 ${seatStr} 號」</strong>：確認該生為本座號主人，並可一鍵移位另一位同學。<br>
          • 點擊 <strong>「🔄 改移至正確座號」</strong>：直接將誤劃同學轉移至其真實座號，<strong>系統自動同步試算表！</strong>
        </div>
        ${studentsHtml}
      `;

      document.getElementById('studentDetailModal').classList.add('active');
    }

    // 19. 教師裁決：確認某生為本號主人，並引導移位另一位誤劃學生
    function confirmSeatOwner(seatStr, confirmedName) {
      const group = currentSeatDataMap.get(seatStr);
      if (!group || !group.activeRecords) return;

      const otherRec = group.activeRecords.find(r => r.studentName !== confirmedName);
      if (otherRec) {
        const input = prompt(
          `✅ 已確認【${confirmedName}】為本班 ${seatStr} 號！\n\n請問另一位誤劃的同學「${otherRec.studentName}」真實座號是幾號？\n\n（請輸入 01~35 正確座號，系統將自動為其移位歸戶並同步試算表；若留空確認則暫維持原狀）：`
        );
        if (input !== null && input.trim()) {
          const sNum = parseInt(input.trim(), 10);
          if (!isNaN(sNum) && sNum >= 1 && sNum <= COURSE_CONFIG.maxSeatNumber) {
            const newSeat = String(sNum).padStart(2, '0');
            executeReassignSeat(otherRec.studentName, seatStr, newSeat);
          } else {
            alert('座號請輸入 01 到 35 之間的數字！');
          }
        } else {
          document.getElementById('studentDetailModal').classList.remove('active');
        }
      } else {
        alert(`已確認【${confirmedName}】為本號同學！`);
        document.getElementById('studentDetailModal').classList.remove('active');
      }
    }

    // 20. 教師裁決：彈出輸入新座號對話框
    function promptReassignSeat(currentSeat, studentName) {
      const input = prompt(
        `【🔄 一鍵轉移座號】\n\n請輸入學生「${studentName}」的真實座號 (01~35)：\n\n💡 提示：系統將立即將該生移至新座號，並自動同步試算表，您無須登入 Google 雲端！`
      );

      if (input !== null && input.trim()) {
        const sNum = parseInt(input.trim(), 10);
        if (isNaN(sNum) || sNum < 1 || sNum > COURSE_CONFIG.maxSeatNumber) {
          alert('座號請輸入 01 到 35 之間的數字！');
          return;
        }
        const newSeat = String(sNum).padStart(2, '0');
        executeReassignSeat(studentName, currentSeat, newSeat);
      }
    }

    // 21. 執行座號轉移與試算表雙向同步
    async function executeReassignSeat(studentName, oldSeat, newSeat) {
      const classVal = document.getElementById('selectClass').value;
      const unitVal = document.getElementById('selectUnit').value;

      // 步驟 1：本機樂觀更新 (Optimistic UI Update) - 立即見效零等待
      if (Array.isArray(currentLiveRecords)) {
        currentLiveRecords.forEach(r => {
          if (String(r.studentName).trim() === String(studentName).trim()) {
            r.studentSeat = newSeat;
            try {
              if (typeof r.answers === 'string') {
                const parsed = JSON.parse(r.answers);
                parsed.studentSeat = newSeat;
                r.answers = JSON.stringify(parsed);
              } else if (r.answers && typeof r.answers === 'object') {
                r.answers.studentSeat = newSeat;
              }
            } catch (e) {}
          }
        });
      }

      // 重新計算衝突分組與渲染畫面
      const processed = processClassRecords(currentLiveRecords, classVal);
      currentSeatDataMap = processed.seatDataMap;
      currentLiveRecords = processed.cleanList;
      renderLiveDataToMatrix();

      // 關閉彈窗
      document.getElementById('studentDetailModal').classList.remove('active');

      // 步驟 2：背景非同步通知 Google Apps Script 更新試算表
      const payload = {
        action: 'reassignSeat',
        sheetId: unitVal,
        studentClass: classVal,
        studentName: studentName,
        oldSeat: oldSeat,
        newSeat: newSeat
      };

      try {
        await fetch(COURSE_CONFIG.gasEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          mode: 'no-cors'
        });
        alert(`🎉 轉移成功！\n\n已成功將「${studentName}」轉移至 ${newSeat} 號，並已向 Google 試算表發出更新！`);
      } catch (err) {
        console.error('Reassign seat sync error:', err);
        alert(`已於儀表板完成座號轉移！若試算表未及時更新，可於課後透過試算表選單【🧬 生物學習單工具】一鍵整理。`);
      }

      // 3 秒後靜默重新從 GAS 抓取最新資料確認
      setTimeout(() => {
        fetchLiveDataFromGAS(true);
      }, 2500);
    }

    // 22. 匯出 CSV
    function exportCsv() {
      const classVal = document.getElementById('selectClass').value;
      const unitVal = document.getElementById('selectUnit').value;
      if (currentLiveRecords.length === 0) {
        alert('目前無作答資料可匯出！');
        return;
      }

      let csv = "\uFEFF時間戳記,班級,座號,姓名,組別/模式,得分\n";
      currentLiveRecords.forEach(r => {
        csv += `"${r.timestamp}","${r.studentClass}","${r.studentSeat}","${r.studentName}","${r.studentGroup}","${r.score}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${classVal}_單元${unitVal}_學習單成績總表.csv`;
      link.click();
    }
  </script>

<!-- 🔒 教師安全防護 PIN 密碼解鎖 Modal -->
<div id="pinLockModal" class="pin-modal-overlay">
  <div class="pin-modal-card">
    <div class="pin-icon">🔒</div>
    <h2>生物正課 數位學習單平台 安全鎖</h2>
    <p>本平台為國中生物正課數位互動學習單系統，請輸入教師管理密碼解鎖進入：</p>
    <input type="password" id="pinInput" placeholder="請輸入密碼" maxlength="10" autocomplete="off">
    <div id="pinErrorMsg" class="pin-error-text"></div>
    <button id="btnSubmitPin" class="btn-pin-submit">🔓 解鎖進入系統</button>
  </div>
</div>


<script>
// ==================== 🔒 教師安全驗證門禁系統 (預設8088，無洩漏) ====================
(function initGlobalHallGatekeeper() {
  const SESSION_AUTH_KEY = 'bio_teacher_auth_passed';
  const PIN_KEY = 'teacher_global_pin';
  const DEFAULT_PIN = '8088';

  function isAuthed() {
    return sessionStorage.getItem(SESSION_AUTH_KEY) === 'true';
  }

  function setAuthed() {
    sessionStorage.setItem(SESSION_AUTH_KEY, 'true');
  }

  function setup() {
    const modal = document.getElementById('pinLockModal');
    const pinInput = document.getElementById('pinInput');
    const btnSubmit = document.getElementById('btnSubmitPin');
    const errMsg = document.getElementById('pinErrorMsg');

    if (!modal) return;

    if (isAuthed()) {
      modal.classList.add('hidden');
      document.body.style.overflow = 'auto';
      return;
    }

    // 未驗證：強制鎖定畫面
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if (pinInput) setTimeout(() => pinInput.focus(), 200);

    function verifyPin() {
      const entered = (pinInput ? pinInput.value.trim() : '');
      const validPin = localStorage.getItem(PIN_KEY) || DEFAULT_PIN;
      if (entered === validPin) {
        setAuthed();
        modal.classList.add('hidden');
        document.body.style.overflow = 'auto';
        if (pinInput) pinInput.value = '';
        if (errMsg) errMsg.textContent = '';
      } else {
        if (errMsg) errMsg.textContent = '❌ 密碼不正確，請重新輸入！';
        if (pinInput) {
          pinInput.value = '';
          pinInput.focus();
        }
      }
    }

    if (btnSubmit) btnSubmit.onclick = verifyPin;
    if (pinInput) {
      pinInput.onkeydown = (e) => {
        if (e.key === 'Enter') verifyPin();
      };
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setup);
  } else {
    setup();
  }
})();
</script>
